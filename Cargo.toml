[package]
name = "open-terminal"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "open-terminal"
path = "src/main.rs"

[dependencies]
eframe = "0.28"
egui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"

[build-dependencies]
ico = "0.5"
png = "0.18"
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
strip = true
